<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav><a href="/">Калькулятор</a><a href="/about">О себе</a></nav>
  </header>

  <main>
    <h1>Калькулятор</h1>
    <form id="calc-form" class="calc">
      <input name="a" type="text" inputmode="decimal" placeholder="a" autocomplete="off">
      <select name="op">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input name="b" type="text" inputmode="decimal" placeholder="b" autocomplete="off">
      <button type="submit">=</button>
    </form>

    <p id="status" class="status"></p>
    <pre id="output"></pre>
  </main>

  <script src="/js/calc.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
